<nav class="nv-navbar" #navElement aria-label="Main navigation">
  <div class="nv-nav-wrapper">
    <button class="nv-burger" type="button" [class.is-open]="isMenuOpen" (click)="toggleNavbar()" aria-label="Toggle navigation" aria-controls="nav-menu" [attr.aria-expanded]="isMenuOpen">
      <span class="line"></span>
      <span class="line"></span>
      <span class="line"></span>
    </button>

    <a routerLink="/" aria-label="Navrik home" class="nv-brand-logo-link">
      @if (siteSettings.settings().logo_url; as logoUrl) {
        <img [src]="siteSettings.uploadVariantUrl(logoUrl, 320)"
             [attr.srcset]="siteSettings.uploadVariantUrl(logoUrl, 320) + ' 1x, ' + siteSettings.uploadVariantUrl(logoUrl, 640) + ' 2x'"
             alt="Navrik aluminium canopies"
             class="nv-brand-logo-img">
      } @else {
        <span class="nv-brand-fallback">Navrik</span>
      }
    </a>

    <ul id="nav-menu" class="nv-nav-links" [class.is-open]="isMenuOpen">
      <li>
        <a routerLink="/products"
           [class.active]="router.url.startsWith('/products')"
           [attr.aria-current]="router.url.startsWith('/products') ? 'page' : null"
           (click)="closeNavbar()">Canopies</a>
      </li>
      <li>
        <a routerLink="/contact"
           [class.active]="router.url.startsWith('/contact')"
           [attr.aria-current]="router.url.startsWith('/contact') ? 'page' : null"
           (click)="closeNavbar()">Contact</a>
      </li>
    </ul>
  </div>

  @if (isMenuOpen) {
    <div class="nv-drawer-backdrop" (click)="closeNavbar()" aria-hidden="true"></div>
  }
</nav>
