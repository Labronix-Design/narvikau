<div class="toast-container">
  @for (toast of toasts; track toast) {
    <div class="toast" [ngClass]="toast.type" (mouseenter)="pauseToast(toast)"
      (mouseleave)="resumeToast(toast)">
      <span class="toast-icon">
        @if (toast.type === 'success') {
          <mat-icon svgIcon="check_circle"></mat-icon>
        }
        @if (toast.type === 'error') {
          <mat-icon svgIcon="error"></mat-icon>
        }
        @if (toast.type === 'info') {
          <mat-icon svgIcon="info"></mat-icon>
        }
        @if (toast.type === 'warning') {
          <mat-icon svgIcon="warning"></mat-icon>
        }
      </span>
      
      <span class="toast-message">{{ toast.message }}</span>
      
      <button class="close-btn" (click)="closeToast(toast)" aria-label="Close">
        <mat-icon svgIcon="close"></mat-icon>
      </button>
    </div>
  }
</div>
