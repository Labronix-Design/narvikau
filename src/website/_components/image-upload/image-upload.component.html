<div class="img-upload" [class.compact]="compact">
  <div
    class="drop-zone"
    [class.dragging]="isDragging()"
    [class.has-image]="previewSrc"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <input #fileInput type="file" accept="image/jpeg,image/png,image/webp" (change)="onFileInputChange($event)" hidden />

    <button
      type="button"
      class="pick-file"
      [disabled]="isUploading()"
      [attr.aria-label]="previewSrc ? 'Replace image (JPEG, PNG, or WebP, up to 4 MiB)' : 'Choose image (JPEG, PNG, or WebP, up to 4 MiB)'"
      (click)="fileInput.click()"
    >
      @if (previewSrc && !isUploading()) {
        <img [src]="previewSrc" alt="Product image preview" class="preview-img" />
        <div class="preview-overlay">
          <mat-icon svgIcon="edit"></mat-icon>
          @if (!compact) { <span>Replace image</span> }
        </div>
      } @else if (isUploading()) {
        <div class="upload-state">
          <div class="spin"></div>
          @if (!compact) { <span>Uploading…</span> }
        </div>
      } @else {
        <div class="empty-state">
          <mat-icon svgIcon="cloud_upload"></mat-icon>
          @if (!compact) {
            <span class="primary-txt">Click or drag an image here</span>
            <span class="hint-txt">JPEG, PNG, WebP — up to 4 MiB</span>
          }
        </div>
      }
    </button>

    @if (previewSrc && !isUploading()) {
      <button type="button" class="clear-btn" (click)="clearImage()" aria-label="Remove image">
        <mat-icon svgIcon="close"></mat-icon>
      </button>
    }
  </div>

  @if (error()) {
    <div class="upload-err" role="alert">
      <mat-icon svgIcon="error"></mat-icon>
      <span>{{ error() }}</span>
    </div>
  }
</div>
